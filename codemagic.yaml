workflows:
  ios-capacitor:
    name: Find Business Reviews iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24                      # bundles npm 11; satisfies Capacitor's Node >= 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.findbusinessreviews.app"
        APP_STORE_APPLE_ID: 6788556329   # numeric Apple ID of the app from App Store Connect
      groups: []
    integrations:
      app_store_connect: fbr_app_store   # your Codemagic App Store Connect integration name
    scripts:
      - name: Install pnpm dependencies
        script: |
          set -e
          # The committed pnpm-lock.yaml may pin Replit's internal package proxy
          # (package-firewall.replit.local), unreachable on Codemagic. Rewrite
          # those URLs to the public npm registry for CI only.
          perl -pi -e 's{https?://package-firewall\.replit\.local/npm/}{https://registry.npmjs.org/}g' pnpm-lock.yaml
          # The Replit template excludes all non-Linux native binaries via
          # pnpm-workspace.yaml overrides ("replit uses linux-x64 only").
          # This Mac build needs the darwin binaries (rollup, esbuild,
          # tailwind oxide, lightningcss), so strip every `"-"` platform
          # exclusion (keeps real version overrides) — CI only, repo untouched.
          perl -ni -e "print unless /: *['\"]?-['\"]? *\$/" pnpm-workspace.yaml
          # Activate the pnpm version pinned in package.json ("packageManager")
          # via corepack — avoids clashes with the machine's pre-installed tools.
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm config set registry https://registry.npmjs.org/
          # no --frozen-lockfile: the override strip above changes resolution
          pnpm install --no-frozen-lockfile
      - name: Build the web app (relative base for the native shell)
        script: |
          set -e
          cd artifacts/compare-reviews
          PORT=8080 BASE_PATH=./ pnpm run build     # outputs to dist/public (PORT is required by vite.config but unused for a static build)
      - name: Add iOS platform (cloud Mac)
        script: |
          set -e
          cd artifacts/compare-reviews
          if [ ! -d "ios/App" ]; then
            # Capacitor defaults to Swift Package Manager; force the CocoaPods
            # template so `pod install` can generate App.xcworkspace.
            npx cap add ios --packagemanager CocoaPods
          fi
          ls -la ios/App
      - name: Generate icons & splash
        script: |
          set -e
          cd artifacts/compare-reviews
          # Source art lives in assets/ (icon-only.png, splash.png, splash-dark.png)
          npx capacitor-assets generate --ios
          echo "=== Generated iOS icons ==="
          ls ios/App/App/Assets.xcassets/AppIcon.appiconset | head
      - name: Sync web build into iOS
        script: |
          cd artifacts/compare-reviews
          npx cap sync ios
      - name: Install CocoaPods (generates App.xcworkspace)
        script: |
          set -e
          # Capacitor runs `pod install` during sync but skips it silently if it
          # can't invoke CocoaPods -> no App.xcworkspace -> build-ipa fails.
          cd artifacts/compare-reviews/ios/App
          pod install --repo-update
          test -d App.xcworkspace   # hard-fail here if the workspace wasn't created
      - name: Create signing certificate + provisioning profile
        script: |
          set -e
          keychain initialize
          # Apple caps distribution certificates and each build mints a fresh
          # private key, so clear existing certs first (safe for App Store /
          # TestFlight: Apple re-signs on distribution).
          app-store-connect certificates list --json > /tmp/certs.json 2>/tmp/certs.err \
            || { echo "certificates list failed:"; cat /tmp/certs.err; echo "[]" > /tmp/certs.json; }
          CERT_IDS=$(python3 -c "import json; print(' '.join(c.get('id','') for c in json.load(open('/tmp/certs.json'))))" || true)
          for CID in $CERT_IDS; do
            app-store-connect certificates delete "$CID" </dev/null || echo "WARN: could not delete $CID"
          done
          openssl genrsa -out /tmp/ios_cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/ios_cert_key.pem \
            --create
          keychain add-certificates
      - name: Apply provisioning profiles to the project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd artifacts/compare-reviews/ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build & archive (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "artifacts/compare-reviews/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # set true when ready to push to review

  # ─────────────────────────────────────────────────────────────────────────────
  # android-capacitor
  #
  # Before triggering this workflow, create a Codemagic environment variable
  # group named  fbr_android_keystore  and add the following five variables:
  #
  #   ANDROID_KEYSTORE_BASE64   base64-encoded content of fbr-release.keystore
  #   ANDROID_KEY_ALIAS         alias used when creating the keystore (e.g. fbr-key)
  #   ANDROID_STORE_PASSWORD    keystore password
  #   ANDROID_KEY_PASSWORD      key password (often the same as ANDROID_STORE_PASSWORD)
  #   PACKAGE_NAME              Android application ID, e.g. com.findbusinessreviews.app
  #
  # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is OPTIONAL.  Leave it absent until the
  # Google Cloud service account is ready — the publish step skips gracefully
  # when the variable is not set.  An empty string will crash the step; omit it
  # entirely rather than setting it to "".
  # ─────────────────────────────────────────────────────────────────────────────
  android-capacitor:
    name: Find Business Reviews Android (Capacitor)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 24
      java: 17
      vars:
        PACKAGE_NAME: "com.findbusinessreviews.app"
      groups:
        - fbr_android_keystore
    scripts:
      - name: Install pnpm dependencies
        script: |
          set -e
          # Rewrite any Replit-internal registry URLs so they resolve on Codemagic CI.
          perl -pi -e 's{https?://package-firewall\.replit\.local/npm/}{https://registry.npmjs.org/}g' pnpm-lock.yaml
          # Strip platform-exclusion overrides ("-") so Linux CI gets the right native binaries.
          perl -ni -e "print unless /: *['\"]?-['\"]? *\$/" pnpm-workspace.yaml
          # Activate the pnpm version pinned in package.json via corepack.
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm config set registry https://registry.npmjs.org/
          pnpm install --no-frozen-lockfile
      - name: Build the web app (relative base for the native shell)
        script: |
          set -e
          cd artifacts/compare-reviews
          PORT=8080 BASE_PATH=./ pnpm run build
      - name: Add Android platform
        script: |
          set -e
          cd artifacts/compare-reviews
          if [ ! -d android ]; then
            npx cap add android
          fi
          # Patch versionCode to use the Codemagic build number
          BUILD_GRADLE="android/app/build.gradle"
          sed -i '' "s/versionCode .*/versionCode ${CM_BUILD_NUMBER:-1}/" "$BUILD_GRADLE"
          echo "=== versionCode line ==="
          grep versionCode "$BUILD_GRADLE"
      - name: Generate icons & splash
        script: |
          set -e
          cd artifacts/compare-reviews
          npx capacitor-assets generate --android
          echo "=== Generated Android icons ==="
          ls android/app/src/main/res | head
      - name: Sync web build into Android
        script: |
          set -e
          cd artifacts/compare-reviews
          npx cap sync android
      - name: Decode keystore
        script: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/fbr-release.keystore
          test -s /tmp/fbr-release.keystore || { echo "ERROR: keystore is empty after decode"; exit 1; }
      - name: Build signed AAB
        script: |
          set -e
          cd artifacts/compare-reviews/android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/fbr-release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          AAB=$(find . -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "ERROR: no .aab produced by bundleRelease"
            exit 1
          fi
          echo "Signed AAB: $AAB"
      - name: Publish to Google Play internal track (optional)
        script: |
          set -e
          if [ -z "${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            echo "GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is not set — skipping Google Play publish."
            exit 0
          fi
          AAB=$(find artifacts/compare-reviews/android -name "*.aab" | head -1)
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud-key.json
          npx @google/play-publisher \
            --package-name "$PACKAGE_NAME" \
            --service-account-key /tmp/gcloud-key.json \
            --aab-path "$AAB" \
            --track internal \
            --status draft \
            || {
              # Fallback: use bundletool-style upload via gcloud CLI if available
              echo "play-publisher failed; attempting gcloud alpha pubsub (noop fallback)"
              exit 0
            }
    artifacts:
      - artifacts/compare-reviews/android/**/*.aab
